name: Build Android app
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android tests, lint and signed release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start real Worker and D1
        working-directory: .
        run: |
          npm --prefix backend/cloudflare ci
          npm --prefix backend/cloudflare run build:test
          node backend/cloudflare/test/http-server.mjs > /tmp/pindo-worker.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/pindo-worker.log
          exit 1
      - name: Unit tests, lint and debug APK
        env:
          PINDO_SYNC_TEST_ENDPOINT: http://127.0.0.1:8787
          PINDO_BUILD_NUMBER: ${{ github.run_number }}
          PINDO_COMMIT_SHA: ${{ github.sha }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Restore permanent release identity
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PINDO_ANDROID_SIGNING: ${{ secrets.PINDO_ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          value = os.environ.get('PINDO_ANDROID_SIGNING', '')
          if not value:
              print('::warning::Configure PINDO_ANDROID_SIGNING. Android publishing is paused; development APKs will not be released.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('ready=false\n')
          else:
              secret = json.loads(value)
              password, alias = secret['password'], secret['alias']
              assert password and alias and not any(c in password + alias for c in '\r\n')
              print('::add-mask::' + password)
              path = Path(os.environ['RUNNER_TEMP']) / 'pindo-release.p12'
              with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'wb') as out:
                  out.write(base64.b64decode(secret['keystore'], validate=True))
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write(f'PINDO_ANDROID_KEYSTORE_PATH={path}\nPINDO_ANDROID_KEYSTORE_PASSWORD={password}\nPINDO_ANDROID_KEY_ALIAS={alias}\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('ready=true\n')
          PY
      - name: Assemble and verify signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINDO_BUILD_NUMBER: ${{ github.run_number }}
          PINDO_COMMIT_SHA: ${{ github.sha }}
        run: |
          ./gradlew --no-daemon assembleRelease
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/pindo-releases.json"
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          for release in json.loads((temp / 'pindo-releases.json').read_text()):
              asset = next((a for a in release['assets'] if a['name'] == 'android-update.json'), None)
              if asset:
                  urllib.request.urlretrieve(asset['browser_download_url'], temp / 'previous-android-update.json')
                  break
          PY
          mkdir -p "$RUNNER_TEMP/pindo-release"
          python3 ../scripts/verify-android-apk.py app/build/outputs/apk/release/app-release.apk \
            --previous "$RUNNER_TEMP/previous-android-update.json" --output "$RUNNER_TEMP/pindo-release/android-update.json"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pindo-release/Pindo-Android.apk"
      - uses: actions/upload-artifact@v6
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Pindo-Android-release
          path: ${{ runner.temp }}/pindo-release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: Pindo-Android-development
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/screenshots/
          if-no-files-found: ignore
          retention-days: 7
  upgrade:
    name: Verify Android update preserves data and settings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build consecutive versions with the same test identity
        env:
          PINDO_COMMIT_SHA: ${{ github.sha }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$RUNNER_TEMP/pindo-upgrade"
          PINDO_BUILD_NUMBER="$GITHUB_RUN_NUMBER" android/gradlew -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pindo-upgrade/before.apk"
          PINDO_BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 1))" android/gradlew -p android --no-daemon assembleDebug assembleDebugAndroidTest
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pindo-upgrade/after.apk"
      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install, configure, update without uninstalling and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install "$RUNNER_TEMP/pindo-upgrade/before.apk"
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.pindo.app.UpgradeStateTest#seed com.pindo.app.dev.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pindo-upgrade/seed.txt"
            cat "$RUNNER_TEMP/pindo-upgrade/seed.txt"
            rg -q 'OK \(1 test\)' "$RUNNER_TEMP/pindo-upgrade/seed.txt"
            adb install -r "$RUNNER_TEMP/pindo-upgrade/after.apk"
            adb shell am instrument -w -e class com.pindo.app.UpgradeStateTest#verify com.pindo.app.dev.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pindo-upgrade/verify.txt"
            cat "$RUNNER_TEMP/pindo-upgrade/verify.txt"
            rg -q 'OK \(1 test\)' "$RUNNER_TEMP/pindo-upgrade/verify.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Android-upgrade-verification
          path: ${{ runner.temp }}/pindo-upgrade/*.txt
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Publish Android download
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.android.outputs.signed == 'true'
    needs: [android, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Pindo-Android-release
          path: release-files
      - uses: actions/download-artifact@v6
        with:
          name: Android-test-and-lint-reports
          path: preview-files
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: Pindo-Android.apk
        run: |
          set -euo pipefail
          (cd release-files && sha256sum "$APK_NAME" > SHA256SUMS-Android)
          release_tag="android-build-$GITHUB_RUN_NUMBER"
          title="Pindo Android (build $GITHUB_RUN_NUMBER)"
          printf 'Signed Android APK. Subsequent releases use the same identity and preserve app data when installed as updates. Legacy debug APKs used different keys; see README before changing an existing installation.\n\nCommit: `%s`\n\n[Build and test results](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber \
              "release-files/$APK_NAME" release-files/SHA256SUMS-Android release-files/android-update.json
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file release-notes.md --prerelease --latest=false \
              "release-files/$APK_NAME" release-files/SHA256SUMS-Android release-files/android-update.json
          fi
          shopt -s nullglob
          previews=(preview-files/screenshots/*.png)
          if (( ${#previews[@]} > 0 )); then
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber "${previews[@]}"
          fi
          release_url=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          apk_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$release_tag/$APK_NAME"
          printf '### Android download\n\n[Download APK](%s) · [Release details](%s)\n' \
            "$apk_url" "$release_url" >> "$GITHUB_STEP_SUMMARY"
