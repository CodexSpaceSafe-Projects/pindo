name: Remove private deployment artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-private-deployments.yml']
permissions:
  actions: write
  contents: write
concurrency:
  group: remove-private-deployments
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove only artifacts traced to the previous private deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          counts = dict(artifacts_removed=0, logs_removed=0, release_assets_removed=0,
                        runs_cancelled=0, runs_selected=0, releases_selected=0,
                        client_logs_preserved=0, already_absent=0, errors=0)
          stage = 1

          class CleanupError(Exception):
              def __init__(self, status=0):
                  self.status = status

          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True)

          def api(method, path, missing_ok=False):
              for attempt in range(3):
                  request = urllib.request.Request(
                      'https://api.github.com/repos/' + repository + path,
                      data=b'' if method == 'POST' else None, method=method,
                      headers={'Authorization': 'Bearer ' + token,
                               'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          data = response.read()
                          return json.loads(data) if data else True
                  except urllib.error.HTTPError as error:
                      if missing_ok and error.code == 404:
                          return None
                      if error.code in (429, 500, 502, 503, 504) and attempt < 2:
                          time.sleep(min(30, max(1, int(error.headers.get('Retry-After', '2')))))
                          continue
                      raise CleanupError(error.code) from None
              raise CleanupError()

          def pages(path, field=None):
              for page in range(1, 1001):
                  separator = '&' if '?' in path else '?'
                  data = api('GET', path + separator + 'per_page=100&page=' + str(page))
                  items = data[field] if field else data
                  if not isinstance(items, list):
                      raise CleanupError()
                  yield from items
                  if len(items) < 100:
                      return
              raise CleanupError()

          files = {}
          def source(commit, path):
              if not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise CleanupError()
              key = commit, path
              if key not in files:
                  result = git('show', commit + ':' + path)
                  if result.returncode == 0:
                      files[key] = result.stdout
                  elif git('cat-file', '-e', commit + '^{commit}').returncode == 0:
                      files[key] = None
                  else:
                      # A foreign/deleted commit cannot establish a deletion boundary.
                      raise CleanupError()
              return files[key]

          def remove(path, counter):
              if api('DELETE', path, missing_ok=True) is None:
                  counts['already_absent'] += 1
              else:
                  counts[counter] += 1

          try:
              repository = os.environ['GITHUB_REPOSITORY']
              token = os.environ['GH_TOKEN']
              previous = os.environ['PREVIOUS_SHA']
              current = os.environ['CURRENT_SHA']
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository) or not token:
                  raise CleanupError()
              deployment_path = 'backend/cloudflare/deployments/staging.json'
              previous_deployment = source(previous, deployment_path)
              if previous_deployment is None:
                  # A retrying fix can follow the commit which removed this file.
                  history = git('rev-list', previous, '--', deployment_path)
                  if history.returncode:
                      raise CleanupError()
                  for commit in history.stdout.splitlines():
                      previous_deployment = source(commit, deployment_path)
                      if previous_deployment is not None:
                          break
              if previous_deployment is None:
                  raise CleanupError()
              endpoint = json.loads(previous_deployment)['endpoint'].rstrip('/')
              address = urllib.parse.urlsplit(endpoint)
              if address.scheme != 'https' or not address.hostname or not address.hostname.endswith('.workers.dev'):
                  raise CleanupError()

              stage = 2
              mac_paths = ('Sources/Pindo/CloudSyncController.swift',
                           'Sources/Pindo/SyncSettings.swift')
              android_paths = ('android/app/src/main/java/com/pindo/app/SettingsScreen.kt',)
              def client_contains(commit, paths):
                  return any(endpoint in (source(commit, path) or '') for path in paths)

              runs = []
              for run in pages('/actions/runs', 'workflow_runs'):
                  if run['head_sha'] == current:
                      continue
                  kind = None
                  if run.get('path') == '.github/workflows/cloudflare.yml' and run.get('name') in ('Test Cloudflare sync server', 'Test Cloudflare sync core'):
                      deployment = source(run['head_sha'], deployment_path)
                      if deployment is not None and json.loads(deployment).get('endpoint', '').rstrip('/') == endpoint:
                          kind = 'server'
                  elif run.get('path') == '.github/workflows/macos.yml' and run.get('name') == 'Build macOS app':
                      if client_contains(run['head_sha'], mac_paths):
                          kind = 'mac'
                  elif run.get('path') == '.github/workflows/android.yml' and run.get('name') == 'Build Android app':
                      if client_contains(run['head_sha'], android_paths):
                          kind = 'android'
                  if kind:
                      runs.append((run, kind))
              counts['runs_selected'] = len(runs)

              stage = 3
              # Stop all selected producers before listing/deleting their artifacts and logs.
              for run, kind in runs:
                  if run['status'] == 'completed':
                      continue
                  path = '/actions/runs/' + str(run['id'])
                  try:
                      api('POST', path + '/cancel')
                      counts['runs_cancelled'] += 1
                  except CleanupError as error:
                      if error.status != 409 or api('GET', path)['status'] != 'completed':
                          raise
                  deadline = time.monotonic() + 120
                  while api('GET', path)['status'] != 'completed':
                      if time.monotonic() >= deadline:
                          raise CleanupError()
                      time.sleep(2)

              for run, kind in runs:
                  stage = 4
                  artifacts = list(pages('/actions/runs/' + str(run['id']) + '/artifacts', 'artifacts'))
                  for artifact in artifacts:
                      name = artifact['name']
                      selected = ((kind == 'server' and name == 'Pindo-Cloudflare-server') or
                                  (kind == 'mac' and name.startswith('Pindo-macOS-')) or
                                  (kind == 'android' and name in ('Pindo-Android-debug', 'Android-test-and-lint-reports')))
                      if selected:
                          remove('/actions/artifacts/' + str(artifact['id']), 'artifacts_removed')
                  if kind == 'server':
                      stage = 5
                      remove('/actions/runs/' + str(run['id']) + '/logs', 'logs_removed')
                  else:
                      counts['client_logs_preserved'] += 1

              stage = 6
              client_paths = mac_paths + android_paths
              for release in pages('/releases'):
                  assets_path = '/releases/' + str(release['id']) + '/assets'
                  assets = list(pages(assets_path))
                  if not assets:
                      continue
                  # Resolve the tag itself; target_commitish can be a moving branch.
                  resolved = git('rev-parse', '--verify', '--end-of-options',
                                 'refs/tags/' + release['tag_name'] + '^{commit}')
                  if resolved.returncode:
                      raise CleanupError()
                  commit = resolved.stdout.strip()
                  if commit == current or not any(endpoint in (source(commit, path) or '') for path in client_paths):
                      continue
                  counts['releases_selected'] += 1
                  stage = 7
                  # An affected installer release can also contain revealing screenshots.
                  for asset in assets:
                      remove('/releases/assets/' + str(asset['id']), 'release_assets_removed')
                  stage = 6
              print(json.dumps(counts, sort_keys=True))
          except Exception as error:
              counts['errors'] += 1
              counts['failed_stage'] = stage
              counts['http_status'] = error.status if isinstance(error, CleanupError) else 0
              print(json.dumps(counts, sort_keys=True))
              sys.exit(1)
          PY
