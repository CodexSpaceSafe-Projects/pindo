name: Build macOS app
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  native:
    name: Test and build universal macOS app
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Resolve app version
        id: metadata
        env:
          BUILD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$BUILD_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([-+][0-9A-Za-z.+-]+)?$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo 'Version tags must look like v1.2.3 or v1.2.3-beta.1' >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'archive=Pindo-%s-macOS-universal.zip\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start real Worker and D1 for client tests
        run: |
          npm --prefix backend/cloudflare ci
          npm --prefix backend/cloudflare run build:test
          node backend/cloudflare/test/http-server.mjs > /tmp/pindo-worker.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/pindo-worker.log
          exit 1
      - name: Core tests and native compilation
        env:
          PINDO_SYNC_TEST_ENDPOINT: http://127.0.0.1:8787
          PINDO_TEST_CJK_FONT_PATH: ${{ runner.temp }}/pindo-fonts/SourceHanSerifSC-Regular.otf
        run: |
          set -euo pipefail
          bash scripts/prepare-macos-font-test.sh "$PINDO_TEST_CJK_FONT_PATH"
          swift test --jobs 4 2>&1 | tee /tmp/pindo-tests.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android reads Swift ciphertext and writes to the same Worker
        env:
          PINDO_SYNC_TEST_ENDPOINT: http://127.0.0.1:8787
          PINDO_INTEROP_PHASE: android
        run: android/gradlew -p android --no-daemon testDebugUnitTest --tests com.pindo.app.V3IntegrationTest
      - name: Swift reads Android ciphertext from the same Worker
        env:
          PINDO_SYNC_TEST_ENDPOINT: http://127.0.0.1:8787
          PINDO_INTEROP_PHASE: verify
        run: swift test --jobs 4 --filter SyncV3HTTPTests
      - name: Bundle and verify application
        env:
          PINDO_UNIVERSAL: '1'
          PINDO_VERSION: ${{ steps.metadata.outputs.version }}
          PINDO_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          bash scripts/build-app.sh 2>&1 | tee /tmp/pindo-build.log
      - name: Smoke-launch the app
        run: |
          set -euo pipefail
          app_binary="$PWD/dist/Pindo.app/Contents/MacOS/Pindo"
          "$app_binary" > /tmp/pindo-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat /tmp/pindo-startup.log
            exit 1
          fi
      - name: Archive application
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent dist/Pindo.app "dist/$ARCHIVE_NAME"
          cd dist
          shasum -a 256 "$ARCHIVE_NAME" > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: Pindo-macOS-${{ steps.metadata.outputs.version }}
          path: |
            dist/Pindo-*-macOS-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Annotate build errors
        if: failure()
        run: python3 scripts/ci-annotate.py /tmp/pindo-tests.log /tmp/pindo-build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macOS-build-logs
          path: /tmp/pindo-*.log
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Publish GitHub release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Pindo-macOS-${{ needs.native.outputs.version }}
          path: release-files
      - name: Publish application and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.native.outputs.version }}
          ARCHIVE_NAME: ${{ needs.native.outputs.archive }}
        run: |
          set -euo pipefail
          options=(--latest=true)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$BUILD_REF"
            title="Pindo ${release_tag#v}"
            options+=(--verify-tag)
            if [[ "$release_tag" == *-* ]]; then
              options=(--verify-tag --prerelease --latest=false)
            fi
          else
            release_tag="build-$GITHUB_RUN_NUMBER"
            title="Pindo $APP_VERSION (build $GITHUB_RUN_NUMBER)"
          fi
          printf 'Commit: `%s`\n\n[Build and test results](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber \
              "release-files/$ARCHIVE_NAME" release-files/SHA256SUMS
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file release-notes.md --generate-notes "${options[@]}" \
              "release-files/$ARCHIVE_NAME" release-files/SHA256SUMS
          fi
          release_url=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf '### Download\n\n[%s](%s)\n' "$title" "$release_url" >> "$GITHUB_STEP_SUMMARY"
