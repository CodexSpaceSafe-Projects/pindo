name: Test Cloudflare sync core
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  log-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:staging
      - uses: actions/upload-artifact@v6
        with:
          name: Pindo-Cloudflare-server
          path: work/cloudflare-staging/
          if-no-files-found: error
          retention-days: 14
  staging-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: log-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public staging health and unauthenticated denial
        run: node scripts/check-cloudflare-staging.mjs
