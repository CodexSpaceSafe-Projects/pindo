name: Test Cloudflare sync server
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:bundle
      - uses: actions/upload-artifact@v6
        with:
          name: Pindo-Cloudflare-server
          path: |
            work/cloudflare-bundle/worker.mjs
            backend/cloudflare/deployments/staging.example.json
            backend/cloudflare/migrations/*.sql
          if-no-files-found: error
          retention-days: 14
